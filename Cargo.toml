[package]
name = "toolboks"
version = "0.1.0"
edition = "2021"
description = "A lightweight toolbox of system utilities"

[dependencies]
# glow (OpenGL) instead of the default wgpu renderer: far smaller and lighter on RAM.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = { version = "0.37", default-features = false }
sysinfo = "0.40.0"
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
