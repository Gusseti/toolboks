[package]
name = "toolboks"
version = "0.8.0"
edition = "2021"
description = "A lightweight toolbox of system utilities"
license = "MIT"
repository = "https://github.com/Gusseti/toolboks"

[dependencies]
# glow (OpenGL) instead of the default wgpu renderer: far smaller and lighter on RAM.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = { version = "0.37", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.40.0", features = ["gpu"] }
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_EventLog", "Win32_System_Services", "Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Variant", "Win32_System_Ole", "Management_Deployment", "ApplicationModel", "Foundation", "Foundation_Collections", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
