[package]
name = "toolboks"
version = "0.17.1"
edition = "2021"
description = "A lightweight toolbox of system utilities"
license = "MIT"
repository = "https://github.com/Gusseti/toolboks"

[workspace]
members = ["sdk/toolboks-addon-sdk", "sdk/examples/hello-addon", "sdk/toolboks-addon-proto", "shared/toolboks-shared", "shared/toolboks-debloat-engine", "shared/toolboks-catalog"]
resolver = "2"

[features]
# Isolated local builds: separate window/instance and no self-update traffic or swaps.
preview = ["toolboks-shared/preview", "toolboks-addon-sdk/admin-preview"]

[dependencies]
toolboks-addon-sdk = { path = "sdk/toolboks-addon-sdk", features = ["native-ui"] }
toolboks-addon-proto = { path = "sdk/toolboks-addon-proto" }
toolboks-shared = { path = "shared/toolboks-shared", features = ["ui"] }
# Signed add-on catalog: verification only, see src/catalog.rs.
toolboks-catalog = { path = "shared/toolboks-catalog" }
serde = { version = "1", features = ["derive"] }
# glow (OpenGL) instead of the default wgpu renderer: far smaller and lighter on RAM.
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "links"] }
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_Security_Authorization", "Win32_System_Registry"] }

[dev-dependencies]
# The headless add-on runtime drives the add-on view in tests and in the addon_view_demo example.
toolboks-addon-sdk = { path = "sdk/toolboks-addon-sdk", features = ["native-ui", "runtime"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[example]]
name = "admin_dialog"
required-features = ["preview"]
