[package]
name = "toolboks-addon-sdk"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Toolboks manifest, package validation, and declarative UI contract"

[dependencies]
egui = { version = "0.37", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
native-ui = ["dep:egui"]

[[bin]]
name = "tbaddon"
path = "src/main.rs"
