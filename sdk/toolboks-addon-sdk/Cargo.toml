[package]
name = "toolboks-addon-sdk"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Toolboks manifest, package validation, and declarative UI contract"

[dependencies]
egui = { version = "0.37", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toolboks-addon-proto = { path = "../toolboks-addon-proto", optional = true }

[features]
# Native dialog demonstration only; never applies an administrator action.
admin-preview = ["native-ui"]
native-ui = ["dep:egui", "dep:toolboks-addon-proto"]
# Out-of-process add-ons: the headless egui loop that speaks the wire protocol.
runtime = ["native-ui", "dep:toolboks-addon-proto"]

[[bin]]
name = "tbaddon"
path = "src/main.rs"

[[test]]
name = "runtime"
required-features = ["runtime"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
