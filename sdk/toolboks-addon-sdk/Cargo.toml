[package]
name = "toolboks-addon-sdk"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Toolboks manifest, package validation, and declarative UI contract"

[dependencies]
egui = { version = "0.37", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toolboks-addon-proto = { path = "../toolboks-addon-proto", optional = true }

[features]
native-ui = ["dep:egui"]
# Out-of-process add-ons: the headless egui loop that speaks the wire protocol.
runtime = ["native-ui", "dep:toolboks-addon-proto"]

[[bin]]
name = "tbaddon"
path = "src/main.rs"

[[test]]
name = "runtime"
required-features = ["runtime"]
