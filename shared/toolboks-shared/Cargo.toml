[package]
name = "toolboks-shared"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Code shared by the Toolboks host and its add-ons"

[features]
# The egui design tokens and widgets (cards, toggles, gauges); off for crates without a UI.
ui = ["dep:egui", "dep:toolboks-addon-sdk"]

[dependencies]
egui = { version = "0.37", optional = true, default-features = false }
# The tutorial overlay marks graph cards through the SDK.
toolboks-addon-sdk = { path = "../../sdk/toolboks-addon-sdk", features = ["native-ui"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
