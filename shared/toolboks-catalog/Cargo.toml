[package]
name = "toolboks-catalog"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Signed add-on catalog for Toolboks: index format, detached signature and verifier"

[dependencies]
# Verification only. Key generation (the `random` feature) is enabled by tools/catalog-sign alone,
# so the host never links a random source or creates keys.
ed25519-compact = { version = "2", default-features = false, features = ["opt_size"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toolboks-addon-sdk = { path = "../../sdk/toolboks-addon-sdk" }
