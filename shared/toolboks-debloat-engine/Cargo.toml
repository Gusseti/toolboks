[package]
name = "toolboks-debloat-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Debloater engine: catalog, plan and the Windows backends, without UI"

[dependencies]
serde = { version = "1", features = ["derive"] }
toolboks-shared = { path = "../toolboks-shared" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Services", "Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Management_Deployment", "ApplicationModel", "Foundation", "Foundation_Collections"] }
