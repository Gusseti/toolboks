# THROWAWAY SPIKE for #78. Own workspace: nothing in the app depends on it.
[workspace]
members = ["proto", "addon", "host", "eframe-shim"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Quick iteration profile only; measurements use `release`.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
