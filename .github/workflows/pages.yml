name: Deploy landing page

# Publishes site/ to GitHub Pages (https://gusseti.github.io/toolboks/).
#
# Settings > Pages > Source should be "GitHub Actions". While it is still "Deploy from a branch",
# GitHub rebuilds a plain page from README.md after EVERY push to main and replaces this site.
# The workflow_run trigger below is the safeguard for that: it publishes the landing page again
# each time that README build finishes, so the landing page is always the one left standing.
# Once the source is "GitHub Actions" the README build no longer runs and the trigger is idle.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
