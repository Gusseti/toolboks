name: CI

# Manual only: checks run locally (cargo fmt, clippy, test), not on every push.
# Start one from the Actions tab, or: gh workflow run CI --ref staging
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo build --release --workspace --locked

      - run: cargo clippy --workspace --all-targets --features preview --locked -- -D warnings
      - run: cargo test --workspace --features preview --locked -- --test-threads=1
      - run: cargo build --release --workspace --features preview --locked
