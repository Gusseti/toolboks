name: CI

# Manual only: checks run locally (cargo fmt, clippy, test), not on every push.
# Start one from the Actions tab, or: gh workflow run CI --ref staging
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked

      - run: cargo clippy --workspace --all-targets --features preview --locked -- -D warnings
      - run: cargo test --workspace --features preview --locked
      - run: cargo build --release --workspace --features preview --locked
