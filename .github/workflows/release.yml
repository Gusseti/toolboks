name: Release

# Publishes a release when:
#  - main gets a commit whose Cargo.toml version has no release yet (the normal way), or
#  - a version tag vX.Y.Z / vX.Y.Z-rc.N is pushed (pre-releases from staging via scripts/release.ps1).
# A push to main that does not change the version releases nothing.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and whether it is new
        id: ver
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $tag"
          }
          gh release view $tag *> $null
          $publish = ($LASTEXITCODE -ne 0)
          $LASTEXITCODE = 0
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          "publish=$($publish.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          if (-not $publish) { Write-Host "Release $tag already exists, nothing to publish." }

      - if: steps.ver.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.ver.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2

      - if: steps.ver.outputs.publish == 'true'
        run: cargo build --release --locked

      # The release has exactly two files, named plainly: toolboks.exe and toolboks.exe.sha256.
      # The in-app updater downloads the exe directly and checks the checksum.
      - name: Package
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          Copy-Item target/release/toolboks.exe toolboks.exe
          (Get-FileHash toolboks.exe -Algorithm SHA256).Hash.ToLower() + "  toolboks.exe" | Out-File toolboks.exe.sha256 -Encoding ascii

      - name: Publish GitHub release
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          # Only add --prerelease when needed: an empty argument would be read as a file name.
          $ghArgs = @($tag, "toolboks.exe", "toolboks.exe.sha256", "--target", "${{ github.sha }}", "--title", $tag, "--generate-notes")
          if ($tag -match '-') { $ghArgs += "--prerelease" }
          gh release create @ghArgs
