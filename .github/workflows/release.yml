name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release commit and version
        id: ver
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = & ./scripts/check-release.ps1 -RefType $env:REF_TYPE -RefName $env:REF_NAME -SourceSha $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed' }
          gh release view $tag *> $null
          $publish = ($LASTEXITCODE -ne 0)
          $LASTEXITCODE = 0
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          "publish=$($publish.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii

      - if: steps.ver.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - if: steps.ver.outputs.publish == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify formatting, lint, and tests
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - if: steps.ver.outputs.publish == 'true'
        run: cargo build --release --locked --no-default-features --bin toolboks

      - name: Package the executable and release notes
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          Copy-Item target/release/toolboks.exe toolboks.exe
          (Get-FileHash toolboks.exe -Algorithm SHA256).Hash.ToLower() + "  toolboks.exe" | Out-File toolboks.exe.sha256 -Encoding ascii
          $version = $env:RELEASE_TAG.Substring(1)
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $entry = [regex]::Match((Get-Content CHANGELOG.md -Raw), $pattern)
          if (!$entry.Success) { throw 'The release needs a changelog entry' }
          Set-Content -LiteralPath release-notes.md -Value $entry.Groups[1].Value.Trim() -Encoding utf8

      - if: steps.ver.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: |
            toolboks.exe
            toolboks.exe.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $expected = (Get-Content toolboks.exe.sha256 -Raw).Split(' ', [StringSplitOptions]::RemoveEmptyEntries)[0].Trim()
          if ((Get-FileHash toolboks.exe -Algorithm SHA256).Hash -ine $expected) {
            throw 'The release artifact failed its checksum check'
          }
          $ghArgs = @($env:RELEASE_TAG, 'toolboks.exe', 'toolboks.exe.sha256',
            '--target', $env:SOURCE_SHA, '--title', $env:RELEASE_TAG,
            '--notes-file', 'release-notes.md')
          if ($env:RELEASE_TAG -match '-') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
